<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Vani</title>
<style>
  :root{--bg:#0f1226;--card:#1a1e3c;--gold:#e8b44c;--text:#f3ecda;--user:#2b3166}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at top,#232857,var(--bg));color:var(--text);
    font-family:system-ui,"Noto Sans Devanagari",sans-serif;height:100dvh;display:flex;flex-direction:column}
  header{text-align:center;padding:14px;border-bottom:1px solid #ffffff18}
  header h1{margin:0;font-size:1.25rem;color:var(--gold)}
  header small{opacity:.7}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
  .msg{padding:12px 16px;border-radius:16px;line-height:1.6;white-space:pre-wrap;max-width:88%}
  .user{background:var(--user);align-self:flex-end}
  .krishna{background:var(--card);border:1px solid #e8b44c40;align-self:flex-start}
  form{display:flex;gap:8px;padding:12px;max-width:760px;width:100%;margin:0 auto}
  textarea{flex:1;resize:none;border-radius:12px;border:1px solid #ffffff30;background:var(--card);
    color:var(--text);padding:12px;font:inherit}
  button{background:var(--gold);color:#2a1d00;border:0;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  footer{text-align:center;font-size:.72rem;opacity:.55;padding:0 12px 10px}
</style>
</head>
<body>
<header><h1>🪈 Krishna Vani</h1><small>Apni uljhan batao, Parth — Gita ke prakash mein marg dekhein</small></header>
<div id="chat"></div>
<form id="f">
  <textarea id="in" rows="2" placeholder="Apni situation likho…" autofocus></textarea>
  <button id="send">Bhejo</button>
</form>
<footer>Yeh AI hai jo Bhagavad Gita ki shiksha se prerit hai. Medical, legal ya crisis ki sthiti mein professional/helpline se sampark karein.</footer>
<script>
const chat=document.getElementById('chat'),f=document.getElementById('f'),input=document.getElementById('in'),btn=document.getElementById('send');
const history=[];
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
add('krishna','🙏 Kalyan ho, Parth. Bolo — tumhare man mein kaun sa kurukshetra chal raha hai?');
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text) return;
  input.value=''; btn.disabled=true;
  add('user',text); history.push({role:'user',content:text});
  const bubble=add('krishna','…'); let full='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const reader=r.body.getReader(),dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){
        const d=p.replace(/^data: /,''); if(d==='[DONE]') continue;
        full+=JSON.parse(d).t; bubble.textContent=full; chat.scrollTop=chat.scrollHeight;
      }
    }
    history.push({role:'assistant',content:full});
  }catch{bubble.textContent='Kshama karo vatsa, sampark nahi ho paya.'}
  btn.disabled=false; input.focus();
});
</script>
</body>
</html>
