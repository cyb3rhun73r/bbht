services:
  bughunthq:
    build: .
    image: bughunthq-web
    ports:
      # Bound to all interfaces so devices on your LAN (e.g. a phone on the
      # same Wi-Fi) can reach it via the host's LAN IP. This app can execute
      # active recon/exploitation tools against whatever target you give it
      # and has no login of its own - anyone on this network can reach it
      # while this is running. Revert to "127.0.0.1:8000:8000" (localhost
      # only) if you don't need LAN/phone access.
      - "0.0.0.0:8000:8000"
    environment:
      - BHQ_TOOL_TIMEOUT=900
      - BHQ_JOB_TTL=3600
    restart: unless-stopped
